# Frontend CI — install, lint, build
# Runs on every PR and push to main. Must pass before merge.

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend_v2/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend_v2/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend_v2/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
