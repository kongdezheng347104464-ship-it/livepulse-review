# Production nginx — TLS terminator + reverse proxy.
#
# Local validation: certs/ contains self-signed certs (run gen-self-signed.sh).
# ECS deploy: replace certs/ with Let's Encrypt via certbot (README has steps).

worker_processes auto;
events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- Performance ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;            # don't leak nginx version

    # ---- Upload limit ----
    # M1 caps live recordings at ~2h = ~3-4 GB raw. 5 GB gives headroom.
    # If users hit it, raise + add an upload-too-large frontend message.
    client_max_body_size 5G;
    client_body_timeout 600s;     # 10min — large mobile uploads on weak 4G

    # ---- Gzip ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ---- HTTP → HTTPS redirect ----
    server {
        listen 80 default_server;
        server_name _;

        # ACME challenge passthrough for Let's Encrypt renewal (ECS only,
        # self-signed local doesn't use this). Keep it always — harmless
        # on the self-signed deployment.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- Main HTTPS server ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Self-signed for local validation; replace with Let's Encrypt on ECS.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ---- TLS hardening (Mozilla intermediate, 2024 baseline) ----
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---- Security headers ----
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---- API ----
        # Path-based routing: /api/ → backend, everything else → frontend.
        # Backend handles its own CORS via FastAPI CORSMiddleware.
        location /api/ {
            proxy_pass http://backend:8004;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pipeline endpoints (long-running like /pipeline/.../trigger)
            # need wide read timeouts; uvicorn-side timeout is 60s but the
            # request returns immediately. Set 5min as a safety ceiling.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # SSE / progress streaming: don't buffer so progress updates
            # reach the client immediately (critical UX for the "0%
            # 准备中" anti-pattern documented in retrospective.md).
            proxy_buffering off;
            proxy_cache off;
        }

        # ---- Frontend SPA ----
        # vite-built dist served by the frontend container's own nginx.
        # We just reverse-proxy; the inner nginx handles SPA fallback.
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
